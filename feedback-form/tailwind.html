<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Feedback form (Tailwind CSS)</title>
    <!-- For a quick preview only. In a real project, use your own Tailwind build. -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-50 px-5 py-14">
    <h1 class="mx-auto mb-6 max-w-lg text-2xl font-semibold tracking-tight text-gray-900">Feedback form</h1>
    <!-- Replace YOUR_FORM_ID with your form's id from https://formtango.com -->
    <form action="https://formtango.com/f/YOUR_FORM_ID" method="POST" class="mx-auto max-w-lg space-y-5">
      <div>
        <label for="rating" class="block text-sm font-medium text-gray-700">How would you rate your experience?</label>
        <select id="rating" name="rating" class="mt-1 block w-full rounded-lg border border-gray-300 px-3 py-2 text-gray-900 shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500" required>
          <option value="">Choose…</option>
          <option>Excellent</option>
          <option>Good</option>
          <option>Okay</option>
          <option>Poor</option>
        </select>
      </div>
      <div>
        <label for="comments" class="block text-sm font-medium text-gray-700">What could we do better?</label>
        <textarea id="comments" name="comments" rows="5" class="mt-1 block w-full rounded-lg border border-gray-300 px-3 py-2 text-gray-900 shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500"></textarea>
      </div>
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700">Email (optional)</label>
        <input type="email" id="email" name="email" class="mt-1 block w-full rounded-lg border border-gray-300 px-3 py-2 text-gray-900 shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500">
      </div>
      <!-- Spam trap: leave this hidden and empty -->
      <input type="text" name="_gotcha" class="hidden" tabindex="-1" autocomplete="off">
      <button type="submit" class="w-full rounded-lg bg-indigo-600 px-4 py-2.5 font-semibold text-white hover:bg-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">Send feedback</button>
    </form>
  </body>
</html>
