<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Client intake form (Tailwind CSS)</title>
    <!-- For a quick preview only. In a real project, use your own Tailwind build. -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-50 px-5 py-14">
    <h1 class="mx-auto mb-6 max-w-lg text-2xl font-semibold tracking-tight text-gray-900">Client intake form</h1>
    <!-- Replace YOUR_FORM_ID with your form's id from https://formtango.com -->
    <form action="https://formtango.com/f/YOUR_FORM_ID" method="POST" class="mx-auto max-w-lg space-y-5">
      <div>
        <label for="name" class="block text-sm font-medium text-gray-700">Name</label>
        <input type="text" id="name" name="name" class="mt-1 block w-full rounded-lg border border-gray-300 px-3 py-2 text-gray-900 shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500" required>
      </div>
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
        <input type="email" id="email" name="email" class="mt-1 block w-full rounded-lg border border-gray-300 px-3 py-2 text-gray-900 shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500" required>
      </div>
      <div>
        <label for="phone" class="block text-sm font-medium text-gray-700">Phone</label>
        <input type="tel" id="phone" name="phone" class="mt-1 block w-full rounded-lg border border-gray-300 px-3 py-2 text-gray-900 shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500">
      </div>
      <div>
        <label for="company" class="block text-sm font-medium text-gray-700">Company</label>
        <input type="text" id="company" name="company" class="mt-1 block w-full rounded-lg border border-gray-300 px-3 py-2 text-gray-900 shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500">
      </div>
      <div>
        <label for="website" class="block text-sm font-medium text-gray-700">Website</label>
        <input type="url" id="website" name="website" class="mt-1 block w-full rounded-lg border border-gray-300 px-3 py-2 text-gray-900 shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500">
      </div>
      <div>
        <label for="goals" class="block text-sm font-medium text-gray-700">What do you want help with?</label>
        <textarea id="goals" name="goals" rows="5" class="mt-1 block w-full rounded-lg border border-gray-300 px-3 py-2 text-gray-900 shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500" required></textarea>
      </div>
      <div>
        <label for="timeline" class="block text-sm font-medium text-gray-700">When do you want to start?</label>
        <select id="timeline" name="timeline" class="mt-1 block w-full rounded-lg border border-gray-300 px-3 py-2 text-gray-900 shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500">
          <option value="">Choose…</option>
          <option>As soon as possible</option>
          <option>Within a month</option>
          <option>In the next few months</option>
          <option>Just exploring</option>
        </select>
      </div>
      <div>
        <label for="heard_from" class="block text-sm font-medium text-gray-700">How did you hear about us?</label>
        <input type="text" id="heard_from" name="heard_from" class="mt-1 block w-full rounded-lg border border-gray-300 px-3 py-2 text-gray-900 shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500">
      </div>
      <!-- Spam trap: leave this hidden and empty -->
      <input type="text" name="_gotcha" class="hidden" tabindex="-1" autocomplete="off">
      <button type="submit" class="w-full rounded-lg bg-indigo-600 px-4 py-2.5 font-semibold text-white hover:bg-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">Send details</button>
    </form>
  </body>
</html>
