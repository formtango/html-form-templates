<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Demo request form (Tailwind CSS)</title>
    <!-- For a quick preview only. In a real project, use your own Tailwind build. -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-50 px-5 py-14">
    <h1 class="mx-auto mb-6 max-w-lg text-2xl font-semibold tracking-tight text-gray-900">Demo request form</h1>
    <!-- Replace YOUR_FORM_ID with your form's id from https://formtango.com -->
    <form action="https://formtango.com/f/YOUR_FORM_ID" method="POST" class="mx-auto max-w-lg space-y-5">
      <div>
        <label for="name" class="block text-sm font-medium text-gray-700">Name</label>
        <input type="text" id="name" name="name" class="mt-1 block w-full rounded-lg border border-gray-300 px-3 py-2 text-gray-900 shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500" required>
      </div>
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700">Work email</label>
        <input type="email" id="email" name="email" class="mt-1 block w-full rounded-lg border border-gray-300 px-3 py-2 text-gray-900 shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500" required>
      </div>
      <div>
        <label for="company" class="block text-sm font-medium text-gray-700">Company</label>
        <input type="text" id="company" name="company" class="mt-1 block w-full rounded-lg border border-gray-300 px-3 py-2 text-gray-900 shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500" required>
      </div>
      <div>
        <label for="company_size" class="block text-sm font-medium text-gray-700">Company size</label>
        <select id="company_size" name="company_size" class="mt-1 block w-full rounded-lg border border-gray-300 px-3 py-2 text-gray-900 shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500">
          <option value="">Choose…</option>
          <option>1 to 10</option>
          <option>11 to 50</option>
          <option>51 to 200</option>
          <option>More than 200</option>
        </select>
      </div>
      <div>
        <label for="interest" class="block text-sm font-medium text-gray-700">What would you like to see?</label>
        <textarea id="interest" name="interest" rows="5" class="mt-1 block w-full rounded-lg border border-gray-300 px-3 py-2 text-gray-900 shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500"></textarea>
      </div>
      <!-- Spam trap: leave this hidden and empty -->
      <input type="text" name="_gotcha" class="hidden" tabindex="-1" autocomplete="off">
      <button type="submit" class="w-full rounded-lg bg-indigo-600 px-4 py-2.5 font-semibold text-white hover:bg-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">Request a demo</button>
    </form>
  </body>
</html>
