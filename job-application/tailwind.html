<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Job application (Tailwind CSS)</title>
    <!-- For a quick preview only. In a real project, use your own Tailwind build. -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-50 px-5 py-14">
    <h1 class="mx-auto mb-6 max-w-lg text-2xl font-semibold tracking-tight text-gray-900">Job application</h1>
    <!-- Replace YOUR_FORM_ID with your form's id from https://formtango.com -->
    <form action="https://formtango.com/f/YOUR_FORM_ID" method="POST" enctype="multipart/form-data" class="mx-auto max-w-lg space-y-5">
      <div>
        <label for="name" class="block text-sm font-medium text-gray-700">Name</label>
        <input type="text" id="name" name="name" class="mt-1 block w-full rounded-lg border border-gray-300 px-3 py-2 text-gray-900 shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500" required>
      </div>
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
        <input type="email" id="email" name="email" class="mt-1 block w-full rounded-lg border border-gray-300 px-3 py-2 text-gray-900 shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500" required>
      </div>
      <div>
        <label for="phone" class="block text-sm font-medium text-gray-700">Phone</label>
        <input type="tel" id="phone" name="phone" class="mt-1 block w-full rounded-lg border border-gray-300 px-3 py-2 text-gray-900 shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500">
      </div>
      <div>
        <label for="role" class="block text-sm font-medium text-gray-700">Role you are applying for</label>
        <input type="text" id="role" name="role" class="mt-1 block w-full rounded-lg border border-gray-300 px-3 py-2 text-gray-900 shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500" required>
      </div>
      <div>
        <label for="portfolio" class="block text-sm font-medium text-gray-700">Portfolio or LinkedIn</label>
        <input type="url" id="portfolio" name="portfolio" class="mt-1 block w-full rounded-lg border border-gray-300 px-3 py-2 text-gray-900 shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500">
      </div>
      <div>
        <label for="cover_note" class="block text-sm font-medium text-gray-700">Why do you want this job?</label>
        <textarea id="cover_note" name="cover_note" rows="5" class="mt-1 block w-full rounded-lg border border-gray-300 px-3 py-2 text-gray-900 shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500"></textarea>
      </div>
      <div>
        <label for="cv" class="block text-sm font-medium text-gray-700">CV (PDF or Word)</label>
        <input type="file" id="cv" name="cv" class="mt-1 block w-full text-sm text-gray-700 file:mr-4 file:rounded-lg file:border-0 file:bg-indigo-50 file:px-4 file:py-2 file:font-medium file:text-indigo-700" required>
      </div>
      <!-- Spam trap: leave this hidden and empty -->
      <input type="text" name="_gotcha" class="hidden" tabindex="-1" autocomplete="off">
      <button type="submit" class="w-full rounded-lg bg-indigo-600 px-4 py-2.5 font-semibold text-white hover:bg-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">Apply</button>
    </form>
  </body>
</html>
